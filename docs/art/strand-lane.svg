<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages of taking one expression to every backend without letting the backends drift: expression, emit, parse back, compare, ship, rehash, raster, and frame hash. A generator is one frozen closed-form tree over the variables u, v, t, x, y and i, with twelve operations and no control flow or state. Emitting it produces a GLSL fragment whose division is guarded by a helper that mirrors the Python evaluator's own guard exactly, so the two agree on every input. A recursive-descent parser reads that GLSL back into a tree, and the round trip has to evaluate equal to the original, which is what keeps the emitter honest. The shipped program carries the tree, the source, the uniforms and the sha256 of the canonical expression. Before a single pixel is drawn, the rasterizer rebuilds the tree from the shipped structure, re-hashes it, and refuses to render when the hash no longer matches, so a tampered shader is refused rather than drawn. Rasterizing samples the same u and v range the shader does and maps values through the same piecewise-linear palette ramp, with the top scanline sampling v equals plus one so the headless frame is not flipped against the browser. Each frame's own sha256 is folded back into the receipt. Three outcomes: rendered, refused, and not renderable."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">THE PICTURE ON SCREEN IS THE MATH THAT WAS GRADED</text><text class="h" x="44" y="72">How one expression reaches a shader, a synth, and a PNG without drifting</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M592.25 206V228H143.25V213"/><text class="k" x="367.75" y="245" text-anchor="middle" fill="var(--drift)">THE ROUND TRIP HAS TO EVALUATE EQUAL</text><path class="back" marker-end="url(#ab)" d="M592.25 398V420H143.25V405"/><text class="k" x="367.75" y="437" text-anchor="middle" fill="var(--drift)">A TAMPERED PROGRAM IS REFUSED, NOT DRAWN</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Expression</text><text class="s" x="58" y="168">One frozen tree, no state at</text><text class="s" x="58" y="183">all.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Emit</text><text class="s" x="282.5" y="168">A GLSL fragment, guarded</text><text class="s" x="282.5" y="183">divides.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Parse back</text><text class="s" x="507" y="168">The emitted subset, read</text><text class="s" x="507" y="183">again.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Compare</text><text class="s" x="731.5" y="168">The round trip has to evaluate</text><text class="s" x="731.5" y="183">equal.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Ship</text><text class="s" x="58" y="360">Tree, source, uniforms and a</text><text class="s" x="58" y="375">hash.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Rehash</text><text class="s" x="282.5" y="360">The tree, checked before any</text><text class="s" x="282.5" y="375">pixel.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Raster</text><text class="s" x="507" y="360">The shader's own sampling, in</text><text class="s" x="507" y="375">software.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Frame hash</text><text class="s" x="731.5" y="360">Folded back into the receipt.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">RENDERED</text><text class="s" x="58" y="509" font-size="10.5">pixels from the graded math</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">REFUSED</text><text class="s" x="357.33" y="509" font-size="10.5">the hash moved, so nothing drew</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">NOT RENDERABLE</text><text class="s" x="656.67" y="509" font-size="10.5">an empty strip, never a fake one</text><text class="s" x="44" y="546">A generator is one closed-form expression over u, v and t. Everything else is a projection of it, which is what makes the browser chamber and the headless rasterizer comparable at all. A re-implementation on either side would render something plausible and unverifiable.</text></svg>
