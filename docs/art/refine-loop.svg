<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages of turning a seed into a witnessed generative world: seed, palette, generate, measure, critique, reflect, refine, and witness. The seed drives a fixed integer hash, so one seed with the same generator, colour scheme and novelty corpus rebuilds the same world every time. The corpus grows with each world it grounds, which is why it is named alongside the seed rather than left implicit. The palette is six perceptual swatches from OKLCh, an even lightness ramp across a hue spread the scheme chooses. Parameters start perturbed inside their declared bounds and are clamped there. Measurement samples the generator over a twenty by twenty grid and reduces it to five features: coverage, centroid offset, contrast, entropy and hue. Critique scores each of the generator's axes from zero to one, adds novelty against a persistent corpus of everything made before, and combines them by harmonic mean, so one weak axis pulls the whole score down instead of being averaged away. Reflection picks the single weakest axis. Refinement is bounded coordinate descent: it tries one step up and one step down on every parameter and keeps the single move that improves cohesion most, halving its reach whenever a whole pass fails to improve. Witnessing keeps the best candidate the run ever saw and records whether it converged, which needs cohesion at the target and every axis above the floor. Three outcomes: converged, best effort, and uncertified."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">FROM ONE INTEGER TO A WORLD THAT SURVIVED ITS OWN CRITICS</text><text class="h" x="44" y="72">How a seed becomes a converged world, or an honest unconverged one</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M592.25 206V228H143.25V213"/><text class="k" x="367.75" y="245" text-anchor="middle" fill="var(--drift)">SAME SEED AND CORPUS, SAME WORLD</text><path class="back" marker-end="url(#ab)" d="M592.25 398V420H143.25V405"/><text class="k" x="367.75" y="437" text-anchor="middle" fill="var(--drift)">A STALLED PASS HALVES ITS OWN REACH</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Seed</text><text class="s" x="58" y="168">One integer, hashed to a</text><text class="s" x="58" y="183">start.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Palette</text><text class="s" x="282.5" y="168">Six OKLCh swatches, ramped.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Generate</text><text class="s" x="507" y="168">Parameters inside their</text><text class="s" x="507" y="183">bounds.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Measure</text><text class="s" x="731.5" y="168">Five features off a sample</text><text class="s" x="731.5" y="183">grid.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Critique</text><text class="s" x="58" y="360">Per-axis margins, plus</text><text class="s" x="58" y="375">novelty.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Reflect</text><text class="s" x="282.5" y="360">The weakest axis, not the</text><text class="s" x="282.5" y="375">mean.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Refine</text><text class="s" x="507" y="360">One bounded move at a time.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Witness</text><text class="s" x="731.5" y="360">The best candidate, and a</text><text class="s" x="731.5" y="375">receipt.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">CONVERGED</text><text class="s" x="58" y="509" font-size="10.5">every axis cleared its floor</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">BEST EFFORT</text><text class="s" x="357.33" y="509" font-size="10.5">the strongest try, marked short</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">UNCERTIFIED</text><text class="s" x="656.67" y="509" font-size="10.5">the outside oracle was absent</text><text class="s" x="44" y="546">The loop keeps the best candidate it ever saw, not the last one it tried, so a run that never reaches the target still returns its strongest result and says so. Nothing about the path is hidden: every step it took is carried in the trajectory, with the per-axis margins that made it move.</text></svg>
