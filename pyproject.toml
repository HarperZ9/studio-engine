[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-engine"
version = "0.3.0"
description = "Zero-dependency Python engine that generates replayable creative worlds with shaders, audio data, motion timelines, and receipts."
readme = "README.md"
requires-python = ">=3.10"
license = "FSL-1.1-MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zain Dana Harper" }]
keywords = ["generative", "verification", "accountability", "creative", "rendering", "zero-dependency", "glsl", "webaudio", "shader", "compositor", "oklab", "phyllotaxis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Artistic Software",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/HarperZ9/studio-engine"
Repository = "https://github.com/HarperZ9/studio-engine"
Issues = "https://github.com/HarperZ9/studio-engine/issues"

[project.scripts]
studio-engine = "studio_engine.server:serve"

[tool.setuptools.packages.find]
where = ["."]
include = ["studio_engine*"]
